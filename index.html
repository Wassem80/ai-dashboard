<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Investing Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 20px;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: center;
    }

    th {
      background: #1e293b;
    }

    tr:nth-child(even) {
      background: #1e293b;
    }

    .buy {
      background-color: #065f46 !important;
      font-weight: bold;
    }

    .build {
      background-color: #92400e !important;
    }

    .watch {
      background-color: #7f1d1d !important;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .green { background: #065f46; }
    .orange { background: #92400e; }
    .red { background: #7f1d1d; }

  </style>
</head>

<body>

<div class="header">
  <h1>📊 AI Investing Dashboard</h1>
  <div>
    <span class="badge green">BUY ≥ 4.2</span>
    <span class="badge orange">BUILD ≥ 3.8</span>
    <span class="badge red">WATCH</span>
  </div>
</div>

<table id="stockTable">
  <thead>
    <tr>
      <th>Ticker</th>
      <th>F</th>
      <th>N</th>
      <th>M</th>
      <th>OL</th>
      <th>O</th>
      <th>Total Score</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

// ===== STOCK DATA (EDIT HERE) =====
const stocks = [
  {ticker: "AMD", F:5, N:5, M:4, OL:4, O:4},
  {ticker: "SNOW", F:4, N:5, M:5, OL:3, O:5},
  {ticker: "DDOG", F:4, N:5, M:4, OL:4, O:4},
  {ticker: "CRWD", F:4, N:4, M:3, OL:4, O:4},
  {ticker: "ARM", F:4, N:5, M:3, OL:4, O:4},
  {ticker: "NOW", F:5, N:4, M:2, OL:5, O:3},
  {ticker: "U", F:3, N:4, M:5, OL:2, O:4},
  {ticker: "TSLA", F:3, N:5, M:3, OL:3, O:5}
];

// ===== CALCULATIONS =====
function calculateScore(s) {
  return (s.F*0.3 + s.N*0.2 + s.M*0.2 + s.OL*0.2 + s.O*0.1);
}

function getStatus(score) {
  if (score >= 4.2) return "BUY";
  if (score >= 3.8) return "BUILD";
  return "WATCH";
}

// ===== RENDER =====
function renderTable() {
  const tbody = document.querySelector("#stockTable tbody");
  tbody.innerHTML = "";

  // Sort by score descending
  stocks.sort((a, b) => calculateScore(b) - calculateScore(a));

  stocks.forEach(s => {
    let score = calculateScore(s);
    let status = getStatus(score);

    let row = `
      <tr class="${status.toLowerCase()}">
        <td>${s.ticker}</td>
        <td>${s.F}</td>
        <td>${s.N}</td>
        <td>${s.M}</td>
        <td>${s.OL}</td>
        <td>${s.O}</td>
        <td>${score.toFixed(2)}</td>
        <td>${status}</td>
      </tr>
    `;

    tbody.innerHTML += row;
  });
}

renderTable();

</script>

</body>
</html>
