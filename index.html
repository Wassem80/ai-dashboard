<!DOCTYPE html>
<html>
<head>
  <title>AI Investment Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: #e2e8f0;
      margin: 20px;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    th {
      background: #1e293b;
    }

    tr:nth-child(even) {
      background: #1e293b;
    }

    .green { color: #16a34a; }
    .red { color: #dc2626; }

    select, button {
      padding: 6px;
      border-radius: 6px;
      border: none;
    }
  </style>
</head>

<body>

<h1>📊 AI Investment Dashboard</h1>

<!-- FILTER -->
<div style="margin:20px 0;">
  <select id="filter">
    <option value="ALL">All</option>
    <option value="WIN">Winners</option>
    <option value="LOSS">Losers</option>
  </select>
  <button onclick="render()">Apply</button>
</div>

<!-- SUMMARY -->
<div style="margin:20px 0; display:flex; gap:20px;">
  <div>Total Value: <b id="totalValue">-</b></div>
  <div>Invested: <b id="totalCost">-</b></div>
  <div>P&L: <b id="totalPnL">-</b></div>
  <div>P&L %: <b id="totalPct">-</b></div>
</div>

<table id="stockTable">
<thead>
<tr>
<th>Ticker</th>
<th>Price</th>
<th>Qty</th>
<th>Avg</th>
<th>Value</th>
<th>P&L</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

// ===== PORTFOLIO =====
const stocks = [
  {ticker:"AMZN", qty:790, avg:158},
  {ticker:"AAPL", qty:400, avg:87.7},
  {ticker:"PANW", qty:2600, avg:159},
  {ticker:"NOW", qty:2000, avg:127.5},
  {ticker:"CRWD", qty:550, avg:73.5},
  {ticker:"INTC", qty:2000, avg:22},
  {ticker:"NVO", qty:6000, avg:48},

  {ticker:"U", qty:1250, avg:60},
  {ticker:"IONQ", qty:1500, avg:30.5},
  {ticker:"RXRX", qty:35000, avg:4.1},
  {ticker:"HIMS", qty:5000, avg:16.1},

  {ticker:"VUZI", qty:38500, avg:3.3},
  {ticker:"LCTX", qty:41000, avg:0.9},
  {ticker:"CLOV", qty:5500, avg:11.5},
  {ticker:"SPCE", qty:225, avg:6},
  {ticker:"NIO", qty:500, avg:36.5},
  {ticker:"BYND", qty:120, avg:71.2},

  {ticker:"BA", qty:765, avg:170},
  {ticker:"UBER", qty:400, avg:23.3},
  {ticker:"NCLH", qty:3000, avg:16.2}
];

// ===== STATIC PRICES (SAFE BASELINE) =====
const prices = {
  AMZN:251, AAPL:267, PANW:176, NOW:101, CRWD:116,
  INTC:66, NVO:39, U:25, IONQ:47, RXRX:3.6,
  HIMS:30, VUZI:2.5, LCTX:1.6, CLOV:2.4,
  SPCE:2.9, NIO:6.4, BYND:1.0,
  BA:221, UBER:77, NCLH:19.5
};

// ===== RENDER =====
function render(){

  const tbody = document.querySelector("#stockTable tbody");
  tbody.innerHTML = "";

  let totalValue = 0;
  let totalCost = 0;

  let filter = document.getElementById("filter").value;

  stocks.forEach(s => {

    let price = prices[s.ticker] || 0;
    let value = s.qty * price;
    let cost = s.qty * s.avg;
    let pnl = value - cost;
    let pct = ((price - s.avg) / s.avg) * 100;

    if (filter === "WIN" && pnl <= 0) return;
    if (filter === "LOSS" && pnl >= 0) return;

    totalValue += value;
    totalCost += cost;

    let row = `
      <tr>
        <td>${s.ticker}</td>
        <td>$${price.toFixed(2)}</td>
        <td>${s.qty}</td>
        <td>$${s.avg}</td>
        <td>$${value.toFixed(0)}</td>
        <td class="${pnl>=0?'green':'red'}">
          $${pnl.toFixed(0)} (${pct.toFixed(1)}%)
        </td>
      </tr>
    `;

    tbody.innerHTML += row;
  });

  let totalPnL = totalValue - totalCost;
  let totalPct = (totalPnL / totalCost) * 100;

  document.getElementById("totalValue").innerText = "$"+totalValue.toFixed(0);
  document.getElementById("totalCost").innerText = "$"+totalCost.toFixed(0);
  document.getElementById("totalPnL").innerText = "$"+totalPnL.toFixed(0);
  document.getElementById("totalPct").innerText = totalPct.toFixed(2)+"%";
}

// INIT
render();

</script>

</body>
</html>
